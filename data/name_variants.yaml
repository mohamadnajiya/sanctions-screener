# Heuristic romanisation-variant groups for Arabic (and some Persian/Urdu/Turkish) given names and name parts.
# Every token in a group is folded to the first token (the canonical form) before comparison, so
# "Mohamed Hussein" and "Muhammad Husain" compare as identical strings. This table is a HEURISTIC compiled from
# common transliteration practice (ALA-LC, BGN/PCGN, and the spellings that actually occur in the OFAC / UN / UK
# lists); it is not an authority and cannot be exhaustive. Matches that relied on a group are reported in
# `matched_on` as "romanisation variant" so a reviewer can see what was folded.
#
# Rules of thumb used: vowel alternations (o/u, e/i, a/e), doubled consonants, h-dropping (Mohamed/Mohammed),
# q/k/g for qaf, hamza/ayn apostrophes, ou/u (French-style spellings from North Africa / Lebanon), final -ah/-a/-e.
