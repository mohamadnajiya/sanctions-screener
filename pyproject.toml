[project]
name = "sanctions-screener"
version = "0.1.0"
description = "GCC Sanctions & Terror-List Screener with Arabic-aware matching: OFAC SDN + Consolidated, UN Security Council, EU, UK and the UAE Local Terrorist List, screened offline from a bundled, versioned snapshot. Deterministic fuzzy matching (romanisation variants, Arabic normalisation, name-part reordering, DOB/nationality/ID disambiguation), explainable scores, HTML audit reports. For AI agents (MCP), compliance workflows (REST) and batch files (Apify). No AI calls, no logging of screened names."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Noah's Arch" }]
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6.0.2,<7",
    "rapidfuzz>=3.12,<4",
    "xlrd>=2.0.1,<3",  # refresh job only: the UAE Local Terrorist List is published as a legacy .xls workbook
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
apify = ["apify>=4.2,<5"]  # Actor image only

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.11", "pip-audit>=2.8"]

[project.scripts]
screen = "screen.cli:main"
screen-mcp = "screen.entry:mcp_main"
screen-api = "screen.entry:api_main"
screen-mcp-apify = "screen.entry:apify_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["screen", "agentkit"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "screen/_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"screen/*.py" = ["E501"]
"screen/refresh.py" = ["E501", "S314"]  # stdlib XML on official files fetched by the offline refresh job (see module docstring)
"scripts/*.py" = ["E501"]
"tests/*.py" = ["E501"]
